name: Windows CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build WindowFloatIA.slnx -c Release
      - name: Smoke tests
        run: dotnet run --project tests/WindowFloatIA.Smoke -c Release --no-build
      - name: Package Windows x64
        shell: pwsh
        run: ./scripts/publish.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: WfloatIA-win-x64
          path: |
            artifacts/WfloatIA-win-x64.zip
            artifacts/WfloatIA-win-x64.zip.sha256
          if-no-files-found: error
